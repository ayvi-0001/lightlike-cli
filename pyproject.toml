[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "lightlike"
readme = { "file" = "README.md", "content-type" = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    # Dependencies with conditional "'android' not in platform_release" fail to build on termux.
    "APScheduler>=3.10.4",
    "Pygments>=2.17.2",
    "SQLAlchemy==2.0.31",
    "anyio>=4.3.0",
    "cachetools>=5.3.3",
    "certifi>=2024.7.4",
    "cffi>=1.16.0",
    "charset-normalizer>=3.3.2",
    "click==8.1.7",
    "colorama>=0.4.6",
    "cryptography>=42.0.7",
    "dateparser==1.2.0",
    "db-dtypes>=1.2.0; 'android' not in platform_release",
    "fasteners==0.19",
    "fuzzyfinder>=2.2.0",
    "google-api-core>=2.17.1",
    "google-auth>=2.28.2",
    "google-cloud-bigquery-storage>=2.26.0; 'android' not in platform_release",
    "google-cloud-bigquery>=3.18.0",
    "google-cloud-core>=2.4.1",
    "google-crc32c>=1.5.0",
    "google-resumable-media>=2.7.0",
    "googleapis-common-protos>=1.62.0",
    "greenlet>=3.0.3",
    "h11>=0.14.0",
    "httpcore>=1.0",
    "httpx>=0.27.0",
    "idna==3.7",
    "markdown-it-py>=3.0.0",
    "mdurl>=0.1.2",
    "more-itertools>=10.2.0",
    "numpy>=1.26.4; 'android' not in platform_release",
    "packaging>=23.2",
    "pandas>=2.2.1; 'android' not in platform_release",
    "prompt-toolkit~=3.0.47",
    "protobuf>=4.25.3",
    "pyarrow>=15.0.1; 'android' not in platform_release",
    "pyasn1-modules>=0.3.0",
    "pyasn1>=0.5.1",
    "pycparser>=2.21",
    "python-dateutil>=2.9.0.post0",
    "pytz-deprecation-shim>=0.1.0.post0",
    "pytz>=2024.1",
    "pywin32-ctypes>=0.2.2; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "questionary @ git+https://github.com/tmbo/questionary@caad2e5ce3694d53d1a0666751339262799bed9f",
    "regex>=2023.12.25",
    "requests>=2.32.0",
    "rich~=13.7.1",
    "rsa>=4.9",
    "rtoml>=0.11.0",
    "six>=1.16.0",
    "sniffio>=1.3.1",
    "sqlalchemy-bigquery~=1.11.0",
    "typing_extensions>=4.12.2",
    "tzdata>=2024.1",
    "tzlocal<5,>=4",
    "urllib3>=2.2.2",
    "wcwidth>=0.2.13",
]

[project.urls]
Repository = "https://github.com/ayvi-0001/lightlike-cli"

[project.scripts]
lightlike = "lightlike.cli:main"

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.2.0.240218",
    "pytest-order==1.2.1",
    "pytest-xdist==3.6.1",
    "pytest==8.2.2",
    "ruff>=0.16.6",
    "types-Pygments>=2.17.0.0",
    "types-dateparser>=1.1.4.20240106",
    "types-pytz>=2023.3.1.1",
    "types-six>=1.16.21.20240513",
]
# all = ["lightlike[sqlalchemy-bigquery, dev]"]

[tool.hatch.build.targets.wheel]
packages = ["lightlike"]
dependencies = ["click", "rich"]

[tool.hatch.build.targets.sdist]
packages = ["lightlike"]
dependencies = ["click", "rich"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
format-jinja = """
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- elif revision is not none -%}
        {{ serialize_pep440(base, stage, revision + 1, dev=distance, metadata=[commit]) }}
    {%- else -%}
        {{ serialize_pep440(bump_version(base), stage, revision, dev=distance, metadata=[commit]) }}
    {%- endif -%}
"""

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
preview = true
exclude = [".venv"]
fix = true
line-length = 99
src = ["lightlike", "tests"]
unsafe-fixes = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
extend-ignore = [
    "CPY",     # flake8-copyright
    "D100",    # pydocstyle: undocumented-public-module
    "D101",    # pydocstyle: undocumented-public-class
    "D102",    # pydocstyle: undocumented-public-method
    "D103",    # pydocstyle: undocumented-public-function
    "D104",    # pydocstyle: undocumented-public-package
    "D105",    # pydocstyle: undocumented-magic-method
    "D107",    # pydocstyle: undocumented-public-init
    "D203",    # pydocstyle: incorrect-blank-line-before-class
    "D211",    # pydocstyle: blank-line-before-class
    "D212",    # pydocstyle - multi-line-summary-first-line
    "DOC201",  # pydoclint: docstring-missing-returns
    "DOC501",  # pydoclint:  docstring-missing-exception
    "EXE",     # flake8-executable
    "F841",    # pyflakes: unused-variable
    "FIX",     # flake8-fixme
    "PLC0415", # pylint / convention: import-outside-top-level
    "PLR0913", # pylint / refactor: too-many-arguments
    "PLR0917", # pylint / refactor: too-many-positional-arguments
    "RUF029",  # ruff-specific rules: unused-async
    "TD003",   # flake8-todos: missing-todo-link
]
extend-fixable = [
    "COM", # flake8-commas
    "E",   # pycodestyle / error
    "I",   # isort
    "PYI", # flake8-pyi
    "RSE", # flake8-raise
    "RUF", # ruff-specific rules
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle / warning
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
preview = true
